name: CI

# Scope note (read before adding to this file): this workflow builds and
# tests the actor and validates the container image builds. It
# deliberately does NOT push to any container registry or deploy
# anywhere — that needs registry credentials and an infra/target
# decision (which registry, which host/platform, rollout strategy) that
# aren't available to make here. Adding a push/deploy step is real
# follow-up work, not an oversight.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      # This repo, at the same relative depth (orgs/<org>/<repo>) the
      # superproject uses and this repo's own deps.edn assumes via
      # `:local/root "../../kotoba-lang/..."`.
      - name: Checkout cloud-itonami-isic-6201
        uses: actions/checkout@v4
        with:
          path: orgs/cloud-itonami/cloud-itonami-isic-6201

      # Sibling deps.edn `:local/root` targets (all public kotoba-lang
      # repos). langgraph and crm are direct :local/root deps; langchain
      # is resolved by the base (non-:dev) dependency graph via
      # langgraph's own pinned :git/sha instead, but the `:dev` alias
      # (used below for `clojure -M:dev:test`) overrides it to this
      # local checkout — same workspace-local-dev pattern the
      # superproject itself uses.
      - name: Checkout kotoba-lang/crm
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/crm
          path: orgs/kotoba-lang/crm

      - name: Checkout kotoba-lang/langgraph
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langgraph
          path: orgs/kotoba-lang/langgraph

      - name: Checkout kotoba-lang/langchain
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langchain
          path: orgs/kotoba-lang/langchain

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: clojure -M:dev:test
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6201
        run: clojure -M:dev:test

      - name: clojure -M:lint
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6201
        run: clojure -M:lint

  docker-build:
    name: docker build (build-only, no registry push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cloud-itonami-isic-6201
        uses: actions/checkout@v4

      # Build-only smoke test: catches Dockerfile/dependency-resolution
      # breakage (the Dockerfile itself clones kotoba-lang/crm and
      # kotoba-lang/langgraph and resolves langchain via git/sha, all
      # inside the build — see Dockerfile's header comment). No `docker
      # push`, no registry login, no deploy step — see the scope note
      # at the top of this file.
      - name: docker build .
        run: docker build -t cloud-itonami-isic-6201:ci .
